name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag，例如 v1.0.0"
        required: true
        type: string
      prerelease:
        description: "是否标记为预发布版本"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            goos: windows
            goarch: amd64
            archive: codebuddy2api-windows-x64.zip
          - name: linux-x64
            os: ubuntu-latest
            goos: linux
            goarch: amd64
            archive: codebuddy2api-linux-x64.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install make on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install make --no-progress --yes

      - name: Build the three-file distribution with Makefile
        shell: bash
        env:
          VERSION: ${{ inputs.tag }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
        run: make dist

      - name: Verify distribution contains only the promised files
        shell: bash
        run: |
          test -f dist/config.yaml
          test -f dist/config.reference.yaml
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 3
          test -n "$(find dist -maxdepth 1 -type f -name 'codebuddy-gateway*' -print -quit)"

      - name: Package
        shell: bash
        run: |
          mkdir -p release
          7z a -tzip "release/${{ matrix.archive }}" ./dist/*

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: release/${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release
          pattern: '*'
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/*.zip --clobber
          else
            args=("$TAG" release/*.zip --title "$TAG" --generate-notes)
            if [[ "$PRERELEASE" == "true" ]]; then
              args+=(--prerelease)
            fi
            gh release create "${args[@]}"
          fi
