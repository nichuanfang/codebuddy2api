name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag，例如 v1.0.0"
        required: true
        type: string
      prerelease:
        description: "是否标记为预发布版本"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # upload_delay 为该平台上传 artifact 前的等待秒数：4 个平台构建耗时可观
          # 且几乎同时完成，上传时刻天然挤在一起，会集中冲击
          # ArtifactService/CreateArtifact 并超时（actions/upload-artifact#569）。
          # 用递增延迟把上传窗口错开，构建仍并行，不改动整体结构。
          - name: windows-x64
            os: windows-latest
            goos: windows
            goarch: amd64
            archive: codebuddy2api-windows-x64.zip
            upload_delay: 0
          - name: linux-x64
            os: ubuntu-latest
            goos: linux
            goarch: amd64
            archive: codebuddy2api-linux-x64.zip
            upload_delay: 45
          - name: macos-x64
            os: macos-15-intel
            goos: darwin
            goarch: amd64
            archive: codebuddy2api-macos-x64.zip
            upload_delay: 90
          - name: macos-arm64
            os: macos-15
            goos: darwin
            goarch: arm64
            archive: codebuddy2api-macos-arm64.zip
            upload_delay: 135
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install make on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install make --no-progress --yes

      - name: Build the user distribution with Makefile
        shell: bash
        env:
          VERSION: ${{ inputs.tag }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
        run: make dist

      - name: Verify distribution contains only the promised files
        shell: bash
        run: |
          test -f dist/config.yaml
          test -f dist/config.reference.yaml
          test -f dist/README.md
          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 6
            test -f dist/stop.ps1
            test -f dist/start-on-login.vbs
          else
            test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 4
          fi
          test -n "$(find dist -maxdepth 1 -type f -name 'codebuddy-gateway*' -print -quit)"

      - name: Package
        shell: bash
        run: |
          mkdir -p release
          # 非 Windows 需要保留可执行位，优先用 zip；Windows 上 7z 更通用。
          if [[ "${{ matrix.goos }}" != "windows" ]] && command -v zip >/dev/null 2>&1; then
            (cd dist && zip -r "../release/${{ matrix.archive }}" ./*)
          elif command -v 7z >/dev/null 2>&1; then
            7z a -tzip "release/${{ matrix.archive }}" ./dist/*
          elif command -v 7zz >/dev/null 2>&1; then
            7zz a -tzip "release/${{ matrix.archive }}" ./dist/*
          else
            echo "no zip/7z available" >&2
            exit 1
          fi
          ls -l "release/${{ matrix.archive }}"

      - name: Stagger upload window
        shell: bash
        run: |
          delay=${{ matrix.upload_delay }}
          if [[ "${delay}" -gt 0 ]]; then
            echo "错峰等待 ${delay}s，避开其它平台的上传窗口"
            sleep "${delay}"
          else
            echo "首个平台，直接上传"
          fi

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: release/${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: release
          pattern: '*'
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" release/*.zip --clobber
          else
            args=("$TAG" release/*.zip --title "$TAG" --generate-notes)
            if [[ "$PRERELEASE" == "true" ]]; then
              args+=(--prerelease)
            fi
            gh release create "${args[@]}" --repo "$GITHUB_REPOSITORY"
          fi
